apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-prod

resources:
  - ../../base
  - ingress.yaml
  - pdb.yaml

# 生产环境用 digest 部署：即使有人覆盖了 tag，线上拿到的也是这份确定的镜像
# CI 会在这里写入新的 digest（见 ci/update-manifest.sh）
images:
  - name: harbor.local/demo/backend
    digest: sha256:fa683bd1ecd4f6dcd4f5beabb84fd2cc6dc7e1b7a7e160d4ac9dd7169c39776b
  - name: harbor.local/demo/frontend
    digest: sha256:4761527e35f8990421b83451145bce3226998ef343da8082c471d793a2468100

patches:
  # 生产 3 副本
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  # 生产给更多资源余量
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 300m, memory: 512Mi }
          limits:   { cpu: "1500m", memory: 1Gi }
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 96Mi }
          limits:   { cpu: 500m, memory: 256Mi }
