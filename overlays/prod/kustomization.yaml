apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-prod

resources:
  - ../../base
  - ingress.yaml
  - pdb.yaml

# 生产环境用 digest 部署：即使有人覆盖了 tag，线上拿到的也是这份确定的镜像
# CI 会在这里写入新的 digest（见 ci/update-manifest.sh）
images:
  - name: harbor.local/demo/backend
    digest: sha256:eb75a727452904c3c28fde307bc24966292af5f39fa418d9fe5c2cf84e57e1c0
  - name: harbor.local/demo/frontend
    digest: sha256:edd697a2e94c7e0dcd9f5aec5c6600132e5e4a3dc6cd2f8d18130e4d75e0cb0f

patches:
  # 生产 3 副本
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  # 生产给更多资源余量
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 300m, memory: 512Mi }
          limits:   { cpu: "1500m", memory: 1Gi }
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 96Mi }
          limits:   { cpu: 500m, memory: 256Mi }
