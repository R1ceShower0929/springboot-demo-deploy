apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    tier: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # 先起新 Pod 再停旧 Pod，滚动期间容量不下降
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      imagePullSecrets:
        - name: harbor-pull
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: backend
          image: harbor.local/demo/backend
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MYSQL_MASTER_HOST
              value: mysql-master
            - name: MYSQL_MASTER_PORT
              value: "3306"
            - name: MYSQL_SLAVE_HOST
              value: mysql-slave
            - name: MYSQL_SLAVE_PORT
              value: "3306"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: mysql-secret, key: app-username }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secret, key: app-password }
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-secret, key: password }
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=70.0 -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError"
          # startup 给 JVM + 主从连接留足时间；就绪/存活分开，避免"启动慢"被误判成"死"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
